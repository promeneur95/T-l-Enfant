name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK Android (préinstallé sur le runner)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Clé de signature
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > app/release.jks
          echo "Taille du secret : ${#KS} caractères (attendu 3540)"
          echo "Taille de la clé : $(stat -c %s app/release.jks) octets (attendu 2654)"
          echo "Empreinte : $(sha256sum app/release.jks | cut -c1-16)"
          echo "Mot de passe : ${#KEYSTORE_PASSWORD} caractères (attendu 24)"
          keytool -list -keystore app/release.jks -storepass "$KEYSTORE_PASSWORD" | tail -2

      - name: Compilation
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk TelEnfant.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Version ${{ github.run_number }}
          files: TelEnfant.apk
          make_latest: true
